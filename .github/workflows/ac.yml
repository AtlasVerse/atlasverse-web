name: Siteyi ac
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/ac.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'leri ac
        run: |
          ls *.zip >/dev/null 2>&1 || exit 0
          for z in *.zip; do unzip -o "$z"; rm "$z"; done
          git config user.name "atlasverse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Site yuklendi"
          git push
