name: Siteyi ac
on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/ac.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'leri ac
        run: |
          for z in *.zip; do [ -e "$z" ] || continue; unzip -o "$z"; rm "$z"; done
      - name: Eski proje klasorlerini sil
        run: |
          rm -rf bahceden bellawallet force gelisim gumustepsi kaynanator kid letswin metaatlas orosbook queenbeeest turkiye yemekemek
      - name: Kaydet
        run: |
          git config user.name "atlasverse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Site yuklendi"
          git push
