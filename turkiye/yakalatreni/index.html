<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yakala Treni</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg1:#87ceeb;--bg2:#90ee90;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--blue:#3b82f6}
body.dark{--bg1:#0f172a;--bg2:#1e293b;--card:#273449;--text:#f3f4f6;--muted:#cbd5e1;--line:#475569;--blue:#7dd3fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Fredoka","Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-weight:700;background:linear-gradient(var(--bg1),var(--bg2));color:var(--text);user-select:none;-webkit-user-select:none}
h1,h2,h3,p{margin:0}
button{font:inherit}
.screen{display:none;position:absolute;inset:0;overflow-y:auto;padding:64px 12px 28px;flex-direction:column;align-items:center}
.screen.active{display:flex}
.wrap{margin:auto;width:100%;max-width:640px;text-align:center}
#topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 12px;z-index:50;pointer-events:none}
#topbar>*{pointer-events:auto}
.chip{background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:0 3px 8px rgba(0,0,0,.15);cursor:pointer}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hero{border:6px solid #ffd700}
.hero h1{font-size:2.4rem;color:#f59e0b;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.hero .sub{color:#ef4444;font-size:1.3rem;margin-bottom:6px}
.big{font-size:2.6rem;margin:6px 0}
.row{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.btn{border:0;border-radius:20px;padding:12px 14px;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);background:#6b7280}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.play{width:100%;font-size:1.3rem;margin:12px 0;background:linear-gradient(#ffd700,#ffa500);border:3px solid #fff}
.grid{display:grid;gap:10px}
.menu{grid-template-columns:repeat(3,1fr)}
.menu .btn{font-size:.85rem;padding:12px 4px}
.menu .btn span{display:block;font-size:1.8rem}
.red{background:#ef4444}.blue{background:#3b82f6}.green{background:#22c55e}.purple{background:#a855f7}.orange{background:#f97316}.teal{background:#14b8a6}.pink{background:#ec4899}.indigo{background:#6366f1}.gray{background:#6b7280}.amber{background:#d97706}.lime{background:#65a30d}.cyan{background:#06b6d4}.yellow{background:#eab308}
h2.title{font-size:1.9rem;margin-bottom:10px}
.hint{color:var(--muted);font-size:.95rem;margin-bottom:12px}
.cards{grid-template-columns:repeat(2,1fr)}
@media(min-width:520px){.cards{grid-template-columns:repeat(3,1fr)}}
.edu{background:var(--card);border-radius:22px;padding:14px 8px;box-shadow:0 5px 0 rgba(0,0,0,.12);cursor:pointer;border:3px solid var(--line);transition:transform .15s}
.edu:active{transform:scale(.96)}
.btn.small{padding:6px 14px;font-size:.9rem}.edu{position:relative}.edu.done{border-color:#22c55e}.edu.sel{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.4),0 5px 0 rgba(0,0,0,.12)}
.edu .tick{position:absolute;top:6px;right:10px;color:#22c55e;font-weight:900;font-size:1.2rem}
.stall{background:var(--card);border:3px solid #f59e0b;border-radius:20px;padding:10px;margin:10px 0;text-align:left}
.stall h3{margin:0 0 6px;text-align:center}
.srow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:2px dashed var(--line)}
.srow .em{font-size:2rem}.srow .nm{flex:1;font-size:.95rem}.srow .nm small{display:block;color:var(--muted)}
.srow.sold{opacity:.55}.srow .btn{padding:8px 12px;font-size:.9rem;background:#22c55e}
.stotal{display:flex;justify-content:space-between;font-weight:900;margin-top:8px}
.coinpop{animation:coin .5s ease-out}@keyframes coin{50%{transform:scale(1.3)}}
.btn.teal{background:#0d9488}
.sph{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:middle;background:radial-gradient(circle at 32% 28%,#fff 0,#b6d4ff 14%,#4a7de0 52%,#1b3a8f 100%);box-shadow:0 .05em .09em rgba(0,0,0,.35),inset -.06em -.08em .12em rgba(0,0,0,.25)}
.pic{display:block;width:100%;aspect-ratio:10/7;border-radius:14px;background:#cfe6f5}
.cbox .pic{margin-bottom:6px}.edu .pic{margin-bottom:6px}
.tl{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;font-size:2rem;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fde68a,#f59e0b);color:#7c2d12;font-weight:900;border:4px solid #d97706;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#c-tabs .btn{padding:8px 10px;font-size:.85rem}#c-tabs .btn.on{outline:4px solid #f59e0b}
.cbox{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px;text-align:center;margin-bottom:10px}
.cbox .em{font-size:4rem}.cbox h3{margin:4px 0}.cbox p{margin:6px 0;line-height:1.4}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px 8px;font-size:1rem;font-weight:700;cursor:pointer;color:inherit}
.opt.ok{background:#bbf7d0;border-color:#22c55e;color:#14532d}.opt.bad{background:#fecaca;border-color:#ef4444;color:#7f1d1d}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
.jar{background:var(--card);border:3px solid #ec4899;border-radius:20px;padding:12px;margin-bottom:10px;text-align:center}
.jar .big2{font-size:2.6rem}.jar b{font-size:1.2rem}
.sitem{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px;margin-bottom:8px}
.sitem .em{font-size:2.4rem}.sitem .nm{flex:1}.sitem .nm small{display:block;color:var(--muted)}
.sitem .btn{padding:8px 12px;font-size:.9rem}.sitem.afford{border-color:#22c55e}.sitem.lock{opacity:.6;border-style:dashed}
.sitem .bar{height:8px;margin-top:4px}
.shd{font-weight:900;margin:12px 0 6px}
.own{display:flex;flex-wrap:wrap;gap:6px}.own span{font-size:2.2rem;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:2px 8px}
.own span.on{border-color:#f59e0b}
.lhead,.ldetail,.llabel,.llock{grid-column:1/-1}
.lhead{background:var(--card);border-radius:16px;padding:10px 14px;border:3px solid var(--line)}
.bar{height:12px;border-radius:8px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15);transition:width .4s}
.ldetail{text-align:center;background:var(--card);border-radius:20px;padding:12px;border:3px dashed var(--line)}
.ldetail .em{font-size:4rem}.ldetail .gl{font-size:2rem;font-weight:900;color:#fff;text-shadow:0 0 6px #fff,0 0 14px #FFD700,0 0 28px #FF8C00;-webkit-text-stroke:1px rgba(0,0,0,.25)}
.ldetail .sub{color:var(--muted)}.ldetail .row{justify-content:center;margin-top:6px}
.llabel{font-weight:900;margin-top:6px}.llabel.locked{color:var(--muted)}
.llock{background:var(--card);border-radius:16px;padding:14px;text-align:center;color:var(--muted);border:3px dashed var(--line)}
.edu .em{font-size:3rem}.edu .tr{font-size:1.05rem}.edu .en{color:var(--blue);font-size:.95rem}
.pill{background:var(--card);color:var(--text);border:3px solid #fbbf24;border-radius:999px;padding:6px 16px;font-size:1.2rem;box-shadow:0 3px 8px rgba(0,0,0,.2)}
button.pill{cursor:pointer}
/* oyun */
#screen-game{padding:0}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;z-index:30}
#area{position:absolute;inset:0;overflow:hidden}
.train{position:absolute;bottom:14px;left:-120px;font-size:5rem;animation:drive 9s linear infinite;pointer-events:none}
@keyframes drive{to{left:105vw}}
.item{position:absolute;top:-90px;font-size:3.4rem;padding:6px;cursor:pointer;animation:fall linear forwards;filter:drop-shadow(2px 4px 5px rgba(0,0,0,.3));touch-action:manipulation}
@keyframes fall{to{transform:translateY(calc(100vh + 120px))}}
#area.paused .item,#area.paused .train,#area.paused .gword{animation-play-state:paused}
.gword{position:absolute;z-index:20;pointer-events:none;font-weight:900;font-size:2.6rem;letter-spacing:1px;color:#fff;white-space:nowrap;text-shadow:0 0 6px #fff,0 0 14px #FFD700,0 0 28px #FF8C00,0 0 44px #FF1493;animation:gword 1.8s ease-out forwards}
@keyframes gword{0%{opacity:0;transform:translate(-50%,0) scale(.4)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.25)}40%{opacity:1;transform:translate(-50%,-14px) scale(1)}70%{opacity:.95}100%{opacity:0;transform:translate(-50%,-40px) scale(1.05)}}
#screen-countdown{background:#0f172a;color:#ffd700;align-items:center;justify-content:center}
#cd{font-size:7rem;margin:auto;z-index:2}
#confetti{position:absolute;inset:0;overflow:hidden}
.cf{position:absolute;top:-20px;width:10px;height:10px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(105vh) rotate(720deg)}}
.trophy{font-size:4rem}
.stars{font-size:2.6rem;margin:8px 0}
.stars .off{filter:grayscale(1);opacity:.35}
/* hafıza */
.mgrid{grid-template-columns:repeat(4,1fr);max-width:420px;margin:0 auto}
.mcard{aspect-ratio:1;perspective:800px;cursor:pointer}
.mi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mcard.flipped .mi{transform:rotateY(180deg)}
.mf,.mb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2rem;border:3px solid #fff}
.mf{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.mb{background:#fff;transform:rotateY(180deg)}
.mcard.matched .mb{background:#86efac}
/* eşleştirme */
.mt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;font-size:1.2rem;min-height:56px;display:flex;align-items:center;justify-content:center}
.mt.sel{border-color:#f59e0b;transform:scale(1.05)}
.mt.ok{background:#86efac;border-color:#22c55e;color:#14532d}
.mt.bad{animation:shake .4s;border-color:#ef4444}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.two{grid-template-columns:1fr 1fr;align-items:start}
.two .imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .imgs .mt{font-size:2.4rem}
/* yapboz */
.pgrid{grid-template-columns:repeat(3,1fr);width:min(88vw,330px);margin:0 auto}
.pt{aspect-ratio:1;font-size:2.6rem;display:flex;align-items:center;justify-content:center;background:var(--card);border:4px solid var(--line);border-radius:12px;cursor:pointer}
.pt.sel{border-color:#f59e0b;transform:scale(1.06)}
.pt.good{background:#bbf7d0;border-color:#22c55e}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:96px;margin:0 auto 10px;font-size:1.3rem;background:var(--card);border-radius:10px;padding:4px}
/* müzik */
.xylo{display:flex;gap:5px;align-items:flex-start;justify-content:center;touch-action:manipulation;margin-top:10px}
.xk{flex:1;min-width:0;border:3px solid #fff;border-radius:14px;color:#fff;font-weight:900;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 8px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.xk small{font-size:.7rem;opacity:.9;font-weight:700}
.xk.on{filter:brightness(1.4);transform:translateY(4px) scale(.97)}
.staff{background:#fff;border-radius:16px;padding:6px 6px 2px;box-shadow:0 4px 0 rgba(0,0,0,.12);text-align:center}
.staff svg{width:100%;height:auto;display:block}
.staff .nn{font-size:1.5rem;font-weight:900;min-height:2rem}
.mhint{text-align:center;font-size:.8rem;opacity:.75;margin:4px 0 0}
/* rozet */
.badges{grid-template-columns:repeat(2,1fr)}
@media(min-width:520px){.badges{grid-template-columns:repeat(3,1fr)}}
.bd{background:var(--card);border:4px solid #fbbf24;border-radius:18px;padding:12px 8px}
.bd.lock{border-color:var(--line);filter:grayscale(1);opacity:.55}
.bd .em{font-size:2.6rem}.bd .n{font-size:.95rem}.bd .d{font-size:.78rem;color:var(--muted)}
.stat{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:2px dashed var(--line);font-size:1.05rem}
.note{font-size:.85rem;color:var(--muted);margin-top:12px;line-height:1.4}
.demo{display:inline-block;background:#f97316;color:#fff;border-radius:8px;padding:2px 10px;font-size:.8rem}
.set{display:flex;flex-direction:column;gap:12px}
.set .btn{font-size:1.1rem;width:100%}
.foot{margin-top:14px;font-size:.75rem;color:var(--muted)}
/* modal ve toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#modal.on{display:flex}
#modal .card{max-width:360px;width:100%;text-align:center}
#modal h3{font-size:1.5rem;margin-bottom:8px}
#modal input{width:100%;font:inherit;font-size:1.6rem;text-align:center;padding:8px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--text);margin:10px 0}
#modal .row{margin:12px 0 0}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);background:linear-gradient(135deg,#ffd700,#ffa500);color:#3b2a00;padding:12px 22px;border-radius:999px;border:3px solid #fff;box-shadow:0 10px 25px rgba(0,0,0,.3);z-index:300;transition:transform .4s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
</style>

<style id="av-petek-std">
/* ============================================================
   STANDART PETEK BACKGROUND  ·  Version 1.0  ·  av-petek-std
   Atlasverse Ecosystem: Shared Visual Standard
   Biyolojik referans: işçi arı peteği gözü, yaklaşık 5,4 mm.
   (5,4 mm tasarım referansıdır; CSS boyutları ekrana uyar,
   her cihazda fiziksel 5,4 mm'ye kalibre değildir.)
   Geometri tüm plâtformlarda aynıdır. Markalar yalnızca RENK
   değiştirir: html[data-brand="x"] { --petek-bg; --petek-color; --petek-opacity }
   Tema: light|day  ve  dark|night. İsteğe bağlı mod: data-mode="lady|boy".
   ============================================================ */
:root {
  --petek-reference-mm: 5.4;
  --petek-size: clamp(26px, 2.5vw, 36px);
  --petek-height: calc(var(--petek-size) * 97 / 56);
  --petek-bg: #f6faf1; --petek-color: #b5d99c; --petek-opacity: 0.60;
}
html[data-theme="light"], html[data-theme="day"] { --petek-bg: #f6faf1; --petek-color: #b5d99c; --petek-opacity: 0.60; }
html[data-theme="dark"], html[data-theme="night"] { --petek-bg: #0b1426; --petek-color: #2a4a8a; --petek-opacity: 0.60; }
html[data-mode="lady"] { --petek-bg: #fff6fa; --petek-color: #f5aecb; --petek-opacity: 0.75; }
html[data-mode="lady"][data-theme="dark"], html[data-mode="lady"][data-theme="night"] { --petek-bg: #1d0f1c; --petek-color: #5c2b57; }
html[data-mode="boy"] { --petek-bg: #eefaff; --petek-color: #9fd8ee; --petek-opacity: 0.75; }
html[data-mode="boy"][data-theme="dark"], html[data-mode="boy"][data-theme="night"] { --petek-bg: #07101f; --petek-color: #17407e; }
html, body { min-height: 100%; }
html { background-color: var(--petek-bg) !important; }
body { position: relative; isolation: isolate; background: var(--petek-bg) !important; }
/* Kanonik petek maskesi: geometriyi değiştirme */
body::before, :root[data-theme="night"] body::before, :root[data-theme="day"] body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: var(--petek-color) !important; opacity: var(--petek-opacity) !important;
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><path d='M28 16.17L56 32.33V64.67L28 80.83L0 64.67V32.33Z M28 0V16.17 M28 80.83V97' fill='none' stroke='black' stroke-width='2.6'/></svg>");
  mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><path d='M28 16.17L56 32.33V64.67L28 80.83L0 64.67V32.33Z M28 0V16.17 M28 80.83V97' fill='none' stroke='black' stroke-width='2.6'/></svg>");
  -webkit-mask-repeat: repeat; mask-repeat: repeat;
  -webkit-mask-size: var(--petek-size) var(--petek-height); mask-size: var(--petek-size) var(--petek-height);
}
@media (max-width: 360px) { :root { --petek-size: 26px; } }
@media (min-width: 361px) and (max-width: 600px) { :root { --petek-size: 28px; } }
@media (min-width: 601px) and (max-width: 1024px) { :root { --petek-size: 32px; } }
@media (min-width: 1025px) { :root { --petek-size: 36px; } }
/* END · STANDART PETEK BACKGROUND V1.0 */
</style>
</head>
<body>

<div id="topbar">
  <button id="back" class="chip" hidden>← <span data-i18n="back"></span></button>
  <span id="scorechip" class="chip">⭐ <b id="total">0</b></span>
</div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="modal"><div class="card"><h3 id="m-title"></h3><p id="m-text"></p><input id="m-input" type="number" inputmode="numeric" hidden><div class="row" id="m-btns"></div></div></div>

<!-- ANA MENÜ -->
<section id="screen-start" class="screen active"><div class="wrap">
  <div class="row">
    <button class="chip" id="lang-tr">TR</button>
    <button class="chip" id="lang-en">EN</button>
    <button class="chip" id="dark-btn">🌙</button>
  </div>
  <div class="card hero">
    <h1>Yakala Treni</h1><div class="sub">.com</div>
    <div class="big">🚂👦👧</div>
    <p class="hint" data-i18n="tagline"></p>
    <button class="btn play" data-go="start-game">🎮 <span data-i18n="play"></span></button>
    <div class="grid menu">
      <button class="btn green" data-go="screen-learn"><span>🎓</span><i data-i18n="learn"></i></button>
      <button class="btn blue" data-go="screen-memory"><span>🧠</span><i data-i18n="memory"></i></button>
      <button class="btn red" data-go="screen-match"><span>🔗</span><i data-i18n="match"></i></button>
      <button class="btn orange" data-go="screen-shop"><span>🛒</span><i data-i18n="shop"></i></button>
      <button class="btn purple" data-go="screen-countries"><span>🌍</span><i data-i18n="countries"></i></button>
      <button class="btn amber" data-go="screen-story"><span>📖</span><i data-i18n="story"></i></button>
      <button class="btn pink" data-go="screen-puzzle"><span>🧩</span><i data-i18n="puzzle"></i></button>
      <button class="btn lime" data-go="screen-music"><span>🎵</span><i data-i18n="music"></i></button>
      <button class="btn yellow" data-go="screen-badges"><span>🏅</span><i data-i18n="badges"></i></button>
      <button class="btn indigo" data-go="screen-parent"><span>👩‍🏫</span><i data-i18n="parent"></i></button>
      <button class="btn teal" data-go="screen-store"><span>🛍️</span><i data-i18n="store"></i></button>
      <button class="btn gray" data-go="screen-settings"><span>⚙️</span><i data-i18n="settings"></i></button>
    </div>
  </div>
</div></section>

<!-- GERİ SAYIM -->
<section id="screen-countdown" class="screen"><div id="confetti"></div><div id="cd">3</div></section>

<!-- OYUN -->
<section id="screen-game" class="screen">
  <div class="hud">

let gen=0,ints=[];
const every=(ms,fn)=>{const id=setInterval(fn,ms);ints.push(id);return id};
const after=(ms,fn)=>{const g=gen;return setTimeout(()=>{if(g===gen)fn()},ms)};

/* ---------- Ses ---------- */
let ac;
function tone(f,d=.15,type='sine',delay=0){if(!S.settings.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});if(ac.state==='suspended')ac.resume();
  const t0=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d)}catch(e){}}
const sfxOk=()=>{tone(800);tone(1000,.15,'sine',.1)};
const sfxBad=()=>tone(200,.3,'sawtooth');
const sfxWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'sine',i*.15));
/* ---------- Konuşma (TTS): sağlam sürüm ---------- */
const TTS={refs:[],err:'',voices:[],unlocked:false,warned:{}};
function ttsVoices(){try{TTS.voices=speechSynthesis.getVoices()||[]}catch(e){}return TTS.voices}
const nl=x=>String(x||'').toLowerCase().replace('_','-');
function ttsPick(lang){const v=ttsVoices(),l=nl(lang),p=l.slice(0,2);return v.find(x=>nl(x.lang)===l)||v.find(x=>nl(x.lang).startsWith(p))||null}
try{speechSynthesis.onvoiceschanged=ttsVoices;ttsVoices()}catch(e){}
document.addEventListener('pointerdown',()=>{if(TTS.unlocked)return;TTS.unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}},{once:true});
/* Önce kayıtlı ses (voices.js), kayıt yoksa cihazın konuşması */
let curAud=null,seqId=0;
function ttsOne(text,lang){
  if(!('speechSynthesis' in window))return;const ss=speechSynthesis;
  const run=()=>{try{ss.resume()}catch(e){}const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.9;u.pitch=1.1;const v=ttsPick(lang);if(v)u.voice=v;
    else if(TTS.voices.length&&!TTS.warned[lang]){TTS.warned[lang]=1;toast('🔇 '+t('noVoice',{l:lang.slice(0,2).toUpperCase()}))}
    u.onerror=e=>{TTS.err=e.error||'error'};TTS.refs.push(u);if(TTS.refs.length>20)TTS.refs.shift();ss.speak(u)};
  try{if(ss.speaking||ss.pending){ss.cancel();setTimeout(run,90)}else run()}catch(e){TTS.err=String(e)}}
function speakSeq(list){
  if(!S.settings.sound)return;
  const id=++seqId,q=list.slice();
  try{if(curAud){curAud.onended=null;curAud.pause()}}catch(e){}
  try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  const next=()=>{if(id!==seqId||!q.length)return;const x=q.shift(),src=window.VOICE&&window.VOICE[x[1]+'|'+x[0]];
    if(!src){ttsOne(x[0],x[1]);next();return}
    const a=new Audio(src);curAud=a;a.onended=next;a.onerror=()=>{TTS.err='audio';ttsOne(x[0],x[1]);next()};
    const pr=a.play();if(pr&&pr.catch)pr.catch(e=>{TTS.err=(e&&e.name)||'play';ttsOne(x[0],x[1]);next()})};
  next()}
function speak(text,lang='en-US'){speakSeq([[text,lang]])}
/* Önce Türkçesi, sonra İngilizcesi (ikisi aynıysa bir kez) */
function sayBoth(tr,en){const a=String(tr).replace(/^([A-Z]) - /,'$1, '),b=String(en);
  if(a.toLowerCase()===b.toLowerCase())speakSeq([[a,'tr-TR']]);else speakSeq([[a,'tr-TR'],[b,'en-US']])}

/* ---------- Bildirim ve pencere ---------- */
let toastT;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800)}
function modal({title,text,input,buttons}){
  $('m-title').textContent=title||'';$('m-text').textContent=text||'';
  const inp=$('m-input');inp.hidden=!input;inp.value='';
  const box=$('m-btns');box.innerHTML='';
  buttons.forEach(b=>{const x=document.createElement('button');x.className='btn '+(b.cls||'gray');x.textContent=b.t;
    x.onclick=()=>{const v=inp.value;$('modal').classList.remove('on');if(b.fn)b.fn(v)};box.appendChild(x)});
  $('modal').classList.add('on');if(input)setTimeout(()=>inp.focus(),50);
}
function gate(ok){const a=6+Math.floor(Math.random()*4),b=3+Math.floor(Math.random()*7);
  modal({title:'🔒 '+t('gateT'),text:a+' × '+b+' = ?',input:true,buttons:[{t:t('cancel')},{t:t('ok'),cls:'green',fn:v=>{if(+v===a*b)ok();else toast(t('gateWrong'))}}]})}

/* ---------- Konfeti: alttan yukarı, 180° yağmurlama (sprinkler) ---------- */
function confettiShow(kind){
  const APR=kind==='apricot';
  const cv=$('fx'),dpr=Math.min(2,window.devicePixelRatio||1),W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,ctx=cv.getContext('2d'),g0=gen;
  const cols=['#FFD700','#FF4500','#22c55e','#00BFFF','#FF1493','#a855f7','#ffffff'],P=[];
  const sx=W/2,sy=H+10*dpr,TOT=3600,t0=performance.now(),GR=.3*dpr,VM=Math.sqrt(2*GR*H)*1.12;
  function emit(ang,n,sp){for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*.22,v=VM*sp*(0.45+Math.random()*.6);
    P.push({x:sx+(Math.random()-.5)*30*dpr,y:sy,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,w:(6+Math.random()*7)*dpr,h:(4+Math.random()*6)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)],o:Math.random()<.25,life:0})}}
  emit(Math.PI/2,APR?60:110,1); // açılış patlaması
  if(APR){for(let i=0;i<45;i++){const a=Math.random()*Math.PI*2,v=VM*(.25+Math.random()*.5);P.push({x:W/2,y:H*.45,vx:Math.cos(a)*v*.6,vy:Math.sin(a)*v*.6-VM*.2,w:(16+Math.random()*12)*dpr,h:0,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:'a',o:0,life:0})}}
  let last=t0;
  (function frame(now){
    if(g0!==gen){ctx.clearRect(0,0,W,H);return}
    const el=now-t0;
    if(el<TOT){ // soldan sağa, sonra geri: 180° süpürme
      const ph=el/TOT*2,k=ph<1?ph:2-ph,ang=Math.PI*(1-k); // π (sol) → 0 (sağ) → π
      const steps=Math.max(1,Math.round((now-last)/16));emit(ang,(APR?6:14)*steps,1)}
    last=now;
    ctx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){const q=P[i];q.vy+=GR;q.vx*=.992;q.vy*=.992;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;q.life++;
      if(q.y>H+40||q.life>520){P.splice(i,1);continue}
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.globalAlpha=Math.min(1,(520-q.life)/80);
      if(APR||q.c==='a')drawApricot(ctx,q.w*(q.c==='a'?1:1.9));else if(q.o){ctx.beginPath();ctx.arc(0,0,q.w/2.2,0,7);ctx.fill()}else ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h);ctx.restore()}
    if(el<TOT||P.length)requestAnimationFrame(frame);else ctx.clearRect(0,0,W,H)
  })(t0)}
/* ---------- Kayısı konfetisi ---------- */
function drawApricot(ctx,d){const r=d/2;
  const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#ffd27a');g.addColorStop(.55,'#ffa31a');g.addColorStop(1,'#e57a00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(180,70,0,.45)';ctx.lineWidth=Math.max(1,r*.09);ctx.beginPath();ctx.arc(r*.15,0,r*.78,Math.PI*.62,Math.PI*1.38);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(-r*.38,-r*.4,r*.2,r*.12,-.6,0,7);ctx.fill();
  ctx.fillStyle='#3f9b3a';ctx.beginPath();ctx.ellipse(r*.12,-r*1.02,r*.34,r*.15,-.5,0,7);ctx.fill();
  ctx.strokeStyle='#6b4a1d';ctx.lineWidth=Math.max(1,r*.07);ctx.beginPath();ctx.moveTo(0,-r*.88);ctx.lineTo(0,-r*1.08);ctx.stroke()}
/* Kayısı kasası: tek patlama, ~2 sn, dokunup kasaya topla */
function apricotWin(msg){award('apricot');toast('🧡 '+msg);apricotGame()}
function apricotGame(){
  const cv=$('fx'),dpr=Math.min(2,window.devicePixelRatio||1),W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr,ctx=cv.getContext('2d'),g0=gen;
  const cx=W/2,cy=H-46*dpr,T=2200,AIR=1.8,g=2*H*.6/Math.pow(AIR/2,2),P=[];let got=0;
  const R=()=>Math.random();
  for(let i=0;i<13;i++){const v0=g*(AIR/2)*(.75+R()*.3),vx=(R()-.5)*2*(W*.8)/AIR;
    P.push({x:cx,y:cy-10*dpr,vx,vy:-v0,d:(30+R()*14)*dpr,r:R()*6,vr:(R()-.5)*5,st:0,t0:0})}
  window.__apr=P;const t0=performance.now();let done=false;
  function pt(e){const rc=cv.getBoundingClientRect(),x=(e.clientX-rc.left)*dpr,y=(e.clientY-rc.top)*dpr;let b=null,bd=1e9;
    P.forEach(q=>{if(q.st)return;const dd=Math.hypot(q.x-x,q.y-y);if(dd<Math.max(q.d*.9,34*dpr)&&dd<bd){b=q;bd=dd}});return b}
  const down=e=>{e.stopPropagation();e.preventDefault();const q=pt(e);if(q){q.st=1;q.t0=performance.now();q.sx=q.x;q.sy=q.y;sfxOk()}};
  const stop=e=>{e.stopPropagation();e.preventDefault()};
  document.addEventListener('pointerdown',down,true);document.addEventListener('click',stop,true);
  function end(){if(done)return;done=true;document.removeEventListener('pointerdown',down,true);document.removeEventListener('click',stop,true);
    ctx.clearRect(0,0,W,H);S.apricots=(S.apricots||0)+got;save();
    if(g0===gen)toast('🧺 '+t('aprGot',{n:got,m:S.apricots}))}
  function crate(){const w=84*dpr,h=44*dpr,x=cx-w/2,y=cy-h/2;
    ctx.fillStyle='#b9772f';ctx.beginPath();ctx.roundRect(x,y,w,h,8*dpr);ctx.fill();
    ctx.fillStyle='#8a5516';for(let i=1;i<3;i++)ctx.fillRect(x,y+i*h/3-1.5*dpr,w,3*dpr);
    ctx.fillStyle='#fff';ctx.font='bold '+(18*dpr)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🧡'+got,cx,y-14*dpr)}
  let last=t0;
  (function frame(now){
    if(g0!==gen||done){end();return}
    const el=now-t0,dt=Math.min(.05,(now-last)/1000);last=now;
    ctx.clearRect(0,0,W,H);
    P.forEach(q=>{ctx.save();
      if(q.st===0){q.vy+=g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;
        if(q.y>H+q.d||q.x<-q.d||q.x>W+q.d)q.st=3;
        ctx.translate(q.x,q.y);ctx.rotate(q.r);drawApricot(ctx,q.d)}
      else if(q.st===1){const k=Math.min(1,(now-q.t0)/260),e=k*k;
        const x=q.sx+(cx-q.sx)*e,y=q.sy+(cy-q.sy)*e;ctx.translate(x,y);ctx.scale(1-.55*k,1-.55*k);ctx.rotate(q.r);drawApricot(ctx,q.d);
        if(k>=1){q.st=2;got++}}
      ctx.restore()});
    crate();
    if(el<T||P.some(q=>q.st===1))requestAnimationFrame(frame);else end()
  })(t0)}

const LV=4,LVN=3,CATBADGE={letters:'letters',numbers:'numbers',animals:'animals'};
let lastWord=null;
function lvDone(cat,l){const seen=S.seen['learn-'+cat]||[];return LEARN[cat].slice(l*LV,l*LV+LV).every(x=>seen.includes(x[2]))}
function lvUnlocked(cat){let n=1;while(n<LVN&&lvDone(cat,n-1))n++;return n}
function loadCat(cat){if(curCat!==cat)lastWord=null;curCat=cat;renderCat(cat)}
function renderCat(cat){const box=$('learn-box');box.innerHTML='';
  const seen=S.seen['learn-'+cat]||[],total=LEARN[cat].length,un=lvUnlocked(cat),full=document.createElement.bind(document);
  const head=full('div');head.className='lhead';
  head.innerHTML='<div><b>'+t('level')+' '+un+'/'+LVN+'</b> · '+t('learned',{a:seen.length,b:total})+'</div><div class="bar"><i style="width:'+Math.round(seen.length/total*100)+'%"></i></div>';
  box.appendChild(head);
  const det=full('div');det.className='ldetail';
  if(lastWord){det.innerHTML='<div class="em">'+lastWord[0]+'</div><div class="gl">'+(S.settings.lang==='tr'?lastWord[1]:lastWord[2])+'</div><div class="sub">'+(S.settings.lang==='tr'?lastWord[2]:lastWord[1])+'</div><div class="row"><button class="btn small blue" data-sp="en">🔊 EN</button><button class="btn small red" data-sp="tr">🔊 TR</button></div>';
    det.querySelector('[data-sp=en]').onclick=()=>{speak(lastWord[2]);};
    det.querySelector('[data-sp=tr]').onclick=()=>{speak(lastWord[1].replace(/^([A-Z]) - /,'$1, '),'tr-TR')}}
  else det.innerHTML='<div class="sub">'+t('tapCard')+'</div>';
  box.appendChild(det);
  for(let l=0;l<LVN;l++){
    const lab=full('div');lab.className='llabel'+(l<un?'':' locked');lab.textContent=(l<un?'⭐ ':'🔒 ')+t('level')+' '+(l+1);box.appendChild(lab);
    if(l>=un){const lk=full('div');lk.className='llock';lk.textContent=t('lockMsg',{n:l});box.appendChild(lk);continue}
    LEARN[cat].slice(l*LV,l*LV+LV).forEach(it=>{const ok=seen.includes(it[2]),d=full('div');d.className='edu'+(ok?' done':'')+(lastWord&&lastWord[2]===it[2]?' sel':'');
      d.innerHTML=(ok?'<span class="tick">✓</span>':'')+'<div class="em">'+it[0]+'</div><div class="tr">'+it[1]+'</div><div class="en">'+it[2]+'</div>';
      d.onclick=()=>{const before=lvUnlocked(cat);lastWord=it;sayBoth(it[1],it[2]);sfxOk();markSeen('learn-'+cat,it[2],total,CATBADGE[cat]);
        const after=lvUnlocked(cat);renderCat(cat);
        if(after>before){apricotWin(t('levelUp',{n:after})+' '+t('aprGift'))}else if((S.seen['learn-'+cat]||[]).length>=total)apricotWin(t('catDone')+' '+t('aprGift'))};
      box.appendChild(d)})}}

/* ---------- Hafıza ---------- */
const MEM=[{e:'🍎',en:'Apple',tr:'Elma'},{e:'🐶',en:'Dog',tr:'Köpek'},{e:'🚂',en:'Train',tr:'Tren'},{e:'⭐',en:'Star',tr:'Yıldız'},{e:'📚',en:'Book',tr:'Kitap'},{e:'🎈',en:'Balloon',tr:'Balon'}];
let mem;
function startMemory(){mem={first:null,lock:false,moves:0,matched:0,time:60};
  $('m-moves').textContent=0;$('m-time').textContent=60;
  const g=$('m-grid');g.innerHTML='';
  shuffle([...MEM,...MEM]).forEach(it=>{const c=document.createElement('div');c.className='mcard';
    c.innerHTML='<div class="mi"><div class="mf">❓</div><div class="mb">'+it.e+'</div></div>';c.onclick=()=>flip(c,it);g.appendChild(c)});
  every(1000,()=>{mem.time--;$('m-time').textContent=mem.time;
    if(mem.time<=0){stopAll();modal({title:'⏰ '+t('timeUp'),text:t('timeUpMsg'),buttons:[{t:t('retry'),cls:'green',fn:startMemory},{t:t('menu'),fn:()=>showScreen('screen-start')}]})}});
}
function flip(c,it){if(mem.lock||c.classList.contains('flipped'))return;c.classList.add('flipped');tone(600,.1);
  if(!mem.first){mem.first={c,it};return}
  const a=mem.first;mem.first=null;mem.moves++;$('m-moves').textContent=mem.moves;
  if(a.it.e===it.e){mem.matched++;
    after(400,()=>{a.c.classList.add('matched');c.classList.add('matched');sfxOk();sayBoth(it.tr,it.en)});
    if(mem.matched===MEM.length)after(1100,()=>{const n=mem.moves;stopAll();addScore(30);award('memory');
      modal({title:t('win'),text:t('winMem',{n}),buttons:[{t:t('again'),cls:'green',fn:startMemory},{t:t('menu'),fn:()=>showScreen('screen-start')}]})});
  }else{mem.lock=true;sfxBad();after(900,()=>{a.c.classList.remove('flipped');c.classList.remove('flipped');mem.lock=false})}
}

/* ---------- Eşleştir ---------- */
let mt;
function startMatch(){mt={sel:null,done:0};const im=$('mt-img'),wd=$('mt-word');im.innerHTML='';wd.innerHTML='';
  shuffle(MEM).forEach(it=>{const d=document.createElement('div');d.className='mt';d.dataset.en=it.en;d.textContent=it.e;
    d.onclick=()=>{if(d.classList.contains('ok'))return;im.querySelectorAll('.mt').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');mt.sel=d;tone(600,.1)};im.appendChild(d)});
  shuffle(MEM).forEach(it=>{const d=document.createElement('div');d.className='mt';d.dataset.en=it.en;d.textContent=it.en;
    d.onclick=()=>{if(d.classList.contains('ok')||!mt.sel)return;
      if(mt.sel.dataset.en===it.en){mt.sel.classList.remove('sel');mt.sel.classList.add('ok');d.classList.add('ok');mt.sel=null;mt.done++;sfxOk();sayBoth(it.tr,it.en);
        if(mt.done===MEM.length)after(900,()=>{addScore(30);award('match');modal({title:t('win'),text:t('winMatch'),buttons:[{t:t('again'),cls:'green',fn:startMatch},{t:t('menu'),fn:()=>showScreen('screen-start')}]})})}
      else{d.classList.add('bad');sfxBad();setTimeout(()=>d.classList.remove('bad'),450)}};wd.appendChild(d)})}

/* ---------- Alışveriş ---------- */
const SHOP=[{e:'🍎',tr:'Elma',en:'Apple',p:3},{e:'✏️',tr:'Kalem',en:'Pencil',p:5},{e:'🧸',tr:'Oyuncak',en:'Toy',p:8},{e:'👕',tr:'Tişört',en:'T-Shirt',p:8},{e:'📚',tr:'Kitap',en:'Book',p:12}];
function renderShop(){const box=$('shop-box');box.innerHTML='';$('shop-cash').textContent=S.coins||0;
  SHOP.forEach(it=>{const id='sh-'+it.en,own=S.owned.includes(id),ok=(S.coins||0)>=it.p,d=document.createElement('div');d.className='edu'+(own?' done':'');
    d.innerHTML=(own?'<span class="tick">✓</span>':'')+'<div class="em">'+it.e+'</div><div class="tr">'+it.tr+'</div><div class="en">'+it.en+'</div>'+
      (own?'<div style="margin-top:6px;font-weight:900;color:#16a34a">'+t('mine')+'</div>':'<button class="btn '+(ok?'green':'gray')+'" style="margin-top:6px;padding:6px 12px;font-size:.9rem">🚂'+it.p+'</button>');
    d.onclick=()=>{sayBoth(it.tr,it.en);sfxOk();markSeen('shop',it.en,SHOP.length,'shop')};
    const bt=d.querySelector('button');
    if(bt)bt.onclick=ev=>{ev.stopPropagation();
      if(!ok){sfxBad();toast('🚂'+t('needC',{n:it.p-(S.coins||0)}));return}
      modal({title:it.e,text:t('askBuy',{x:it.tr===it.en?it.en:(S.settings.lang==='tr'?it.tr:it.en),p:it.p}),buttons:[{t:t('cancel')},{t:t('buy'),cls:'green',fn:()=>{if((S.coins||0)<it.p||S.owned.includes(id))return;S.coins-=it.p;S.owned.push(id);save();sfxWin();toast(t('bought',{x:it.e+' '+(S.settings.lang==='tr'?it.tr:it.en)}));renderShop()}}]})};
    box.appendChild(d)})}

      '<div class="cbox" data-hear="cap" style="cursor:pointer"><div class="em">🏛️</div><b>'+t('capital')+'</b><h3>'+cn(c.cap)+'</h3><small>'+t('tapHear')+'</small></div>'+
      '<div class="cbox"><div class="em">🗣️</div><b>'+t('langL')+'</b><h3>'+cn(c.ln)+'</h3></div>'+
      '<div class="cbox"><div class="em">💡</div><b>'+t('funFact')+'</b><p>'+cn(c.fact)+'</p></div>';
  }else if(cTab==='places'){
    h='<p class="hint">'+t('tapPlace')+'</p>';
    if(cPl!==null){const p=c.pl[cPl];h+='<div class="cbox" data-hear="pl">'+pic(c.id,cPl)+'<h3 class="gl2">'+cn(p)+'</h3><p>'+cn(p.x)+'</p></div>'}
    h+='<div class="cgrid">'+c.pl.map((p,i)=>'<div class="edu'+(cPl===i?' sel':'')+'" data-pl="'+i+'">'+pic(c.id,i)+'<div class="tr">'+cn(p)+'</div></div>').join('')+'</div>';
  }else if(cTab==='food'){
    h='<p class="hint">'+t('tapHear')+'</p><div class="cgrid">'+c.fd.map((f,i)=>'<div class="edu" data-fd="'+i+'"><div class="em">'+f.e+'</div><div class="tr">'+cn(f)+'</div></div>').join('')+'</div>';
  }else if(cTab==='hello'){
    h=[['👋',c.hi,t('hello')],['🙏',c.th,t('thanks')]].map((r,i)=>'<div class="cbox" data-hi="'+i+'" style="cursor:pointer"><div class="em">'+r[0]+'</div><b>'+r[2]+'</b><h3 style="font-size:2rem">'+r[1][0]+'</h3><small>'+r[1][1]+'</small><br><small>'+t('tapHear')+'</small><div class="row" style="justify-content:center;margin-top:8px">'+(c.lang==='tr-TR'?'':'<button class="btn small red" data-hp="'+i+'">🔊 '+t('trRead')+'</button>')+(c.lang.startsWith('en')?'':'<button class="btn small green" data-he="'+i+'">🔊 '+t('enMean')+'</button>')+'</div></div>').join('');
  }else{
    if(!cQ){h='<div class="cbox"><div class="em">❓</div><h3>'+t('qStart')+'</h3><button class="btn green" data-qgo="1">'+t('qGo')+'</button></div>'}
    else if(cQ.i>=3){const bonus=cQ.sc===3;h='<div class="cbox"><div class="em">'+(bonus?'🏆':'👏')+'</div><h3>'+t('qDone')+'</h3><p>'+t('qScore',{n:cQ.sc})+(bonus?'<br>'+t('qBonus'):'')+'</p><button class="btn green" data-qgo="1">'+t('qAgain')+'</button></div>'}
    else{const q=cQ.qs[cQ.i];h='<div class="cbox"><div class="em">'+q.em+'</div><h3>'+q.q+'</h3><button class="btn small blue" data-qs="1">🔊</button></div><div class="cgrid">'+q.o.map((o,i)=>'<button class="opt" data-qo="'+i+'">'+o.l+'</button>').join('')+'</div>'}
  }
  body.innerHTML=h;
  if(cTab==='quiz'&&cQ&&cQ.i<3&&cQ.heard!==cQ.i){cQ.heard=cQ.i;speak(cQ.qs[cQ.i].q,L==='tr'?'tr-TR':'en-US')}
  body.querySelectorAll('[data-hear=cap]').forEach(n=>n.onclick=()=>{sayBoth(c.cap.tr,c.cap.en);sfxOk()});
  body.querySelectorAll('[data-hear=pl]').forEach(n=>n.onclick=()=>{say2(c.pl[cPl])});
  body.querySelectorAll('[data-pl]').forEach(n=>n.onclick=()=>{cPl=+n.dataset.pl;sfxOk();say2(c.pl[cPl]);markSeen('cplace-'+c.id,String(cPl),c.pl.length);renderCountry();window.scrollTo(0,0);document.getElementById('screen-country').scrollTop=0});
  body.querySelectorAll('[data-fd]').forEach(n=>n.onclick=()=>{const f=c.fd[+n.dataset.fd];sfxOk();say2(f);markSeen('cfood-'+c.id,String(n.dataset.fd),c.fd.length)});
  body.querySelectorAll('[data-hp]').forEach(n=>n.onclick=ev=>{ev.stopPropagation();const r=+n.dataset.hp===0?c.hi:c.th;sfxOk();speak(r[1].replace(/-/g,' '),'tr-TR')});
  body.querySelectorAll('[data-he]').forEach(n=>n.onclick=ev=>{ev.stopPropagation();sfxOk();speak(+n.dataset.he===0?'Hello':'Thank you','en-US')});
  body.querySelectorAll('[data-qs]').forEach(n=>n.onclick=()=>speak(cQ.qs[cQ.i].q,Lg()==='tr'?'tr-TR':'en-US'));
  body.querySelectorAll('[data-hi]').forEach(n=>n.onclick=()=>{const r=+n.dataset.hi===0?c.hi:c.th;sfxOk();speak(r[2],c.lang);markSeen('chello',c.id+n.dataset.hi,12)});
  body.querySelectorAll('[data-qgo]').forEach(n=>n.onclick=()=>{startCQ();renderCountry()});
  body.querySelectorAll('[data-qo]').forEach(n=>n.onclick=()=>answerCQ(+n.dataset.qo,body))}
function startCQ(){const c=curC,oth=CTR.filter(x=>x.id!==c.id),pick=(arr,k)=>shuf(arr).slice(0,k);
  const qs=[];
  qs.push({em:'🏛️',q:t('qCap',{c:cn(c)}),o:shuf([{l:cn(c.cap),ok:1}].concat(pick(oth,3).map(x=>({l:cn(x.cap)}))))});
  const ci=Math.floor(Math.random()*c.pl.length),cp=c.pl[ci];
  qs.push({em:pic(c.id,ci),q:t('qPlace',{c:cn(c)}),o:shuf([{l:cn(cp),ok:1}].concat(pick(oth,3).map(x=>({l:cn(x.pl[Math.floor(Math.random()*x.pl.length)])}))))});
  const hs=[];oth.forEach(x=>{if(x.hi[0]!==c.hi[0]&&!hs.includes(x.hi[0]))hs.push(x.hi[0])});
  qs.push({em:'👋',q:t('qHello',{c:cn(c)}),o:shuf([{l:c.hi[0],ok:1}].concat(pick(hs,3).map(l=>({l}))))});
  cQ={i:0,sc:0,qs,lock:false}}
function answerCQ(i,body){if(cQ.lock)return;cQ.lock=true;const q=cQ.qs[cQ.i],btns=body.querySelectorAll('.opt');
  q.o.forEach((o,k)=>{if(o.ok)btns[k].classList.add('ok')});
  if(q.o[i].ok){cQ.sc++;sfxOk()}else{btns[i].classList.add('bad');sfxBad()}
  after(1100,()=>{cQ.i++;cQ.lock=false;if(cQ.i>=3&&cQ.sc===3&&!(S.seen.cq||[]).includes(curC.id)){markSeen('cq',curC.id,99);addScore(10);apricotWin(t('aprGift'))}renderCountry()})}

/* ---------- Hikaye ---------- */
const STORY=[
{e:'🚉',t:'İstasyon',x:'Ali ve Ayşe istasyona geldi. Büyük bir tren bekliyordu. Tren onlara el salladı: "Beni yakalayın!"',w:'Station',wt:'İstasyon'},
{e:'🚂',t:'Yolculuk',x:'Tren hareket etti. Vagonlar tıkır tıkır ses çıkarıyordu. Yolcular çok mutluydu!',w:'Train',wt:'Tren'},
{e:'🌳',t:'Orman',x:'Tren ormanın içinden geçti. Ağaçların arasında bir geyik gördüler.',w:'Forest',wt:'Orman'},
{e:'🌊',t:'Deniz',x:'Tren deniz kenarına vardı. Dalgalar sahile vuruyordu. Martılar uçuyordu.',w:'Sea',wt:'Deniz'},
{e:'🏁',t:'Varış',x:'Sonunda tren hedefine ulaştı. Ali ve Ayşe çok mutluydu!',w:'Journey',wt:'Yolculuk'}];
function renderStory(){const box=$('story-box');
  if(S.storyPos>=STORY.length){box.innerHTML='<div class="trophy">🏆</div><h3>'+t('storyEnd')+'</h3><div class="row" style="margin-top:14px"><button class="btn amber" id="st-re">'+t('reread')+'</button></div>';
    $('st-re').onclick=()=>{S.storyPos=0;save();renderStory()};return}
  const c=STORY[S.storyPos];
  box.innerHTML='<div class="trophy">'+c.e+'</div><h3>'+t('chapter')+' '+(S.storyPos+1)+': '+c.t+'</h3><p style="margin:10px 0;font-size:1.1rem;line-height:1.4">'+c.x+'</p>'+
   '<div class="card" style="background:rgba(251,191,36,.25);box-shadow:none;margin-bottom:12px">'+c.w+' ('+c.wt+')</div>'+
   '<div class="row"><button class="btn blue" id="st-l">🔊 '+t('listen')+'</button><button class="btn amber" id="st-n">'+t('next')+' →</button></div>'+
   '<div class="hint">'+(S.storyPos+1)+' / '+STORY.length+'</div>';
  $('st-l').onclick=()=>speakSeq([[c.t+'. '+c.x,'tr-TR'],[c.wt,'tr-TR'],[c.w,'en-US']]);

    if(S.storyPos>=STORY.length&&!S.storyDone){S.storyDone=true;addScore(50);award('story')}renderStory()};
}

/* ---------- Yapboz ---------- */
const PZ=['🍎','🐶','🚂','⭐','📚','🎈','🐱','🦁','🌈'];
let pz;
function startPuzzle(){const target=shuffle(PZ);let tiles;do{tiles=shuffle(target)}while(tiles.every((v,i)=>v===target[i]));
  pz={target,tiles,sel:null,moves:0,time:90};
  $('p-moves').textContent=0;$('p-time').textContent=90;
  $('p-prev').innerHTML=target.map(x=>'<span>'+x+'</span>').join('');
  drawPuzzle();
  every(1000,()=>{pz.time--;$('p-time').textContent=pz.time;
    if(pz.time<=0){stopAll();modal({title:'⏰ '+t('timeUp'),text:t('timeUpMsg'),buttons:[{t:t('retry'),cls:'green',fn:startPuzzle},{t:t('menu'),fn:()=>showScreen('screen-start')}]})}});
}
function drawPuzzle(){const b=$('p-board');b.innerHTML='';
  pz.tiles.forEach((e,i)=>{const d=document.createElement('div');d.className='pt'+(pz.sel===i?' sel':'')+(e===pz.target[i]?' good':'');d.textContent=e;d.onclick=()=>pickTile(i);b.appendChild(d)})}
function pickTile(i){
  if(pz.sel===null){pz.sel=i;tone(600,.1);return drawPuzzle()}
  if(pz.sel===i){pz.sel=null;return drawPuzzle()}
  [pz.tiles[pz.sel],pz.tiles[i]]=[pz.tiles[i],pz.tiles[pz.sel]];pz.sel=null;pz.moves++;$('p-moves').textContent=pz.moves;tone(800,.1);drawPuzzle();
  if(pz.tiles.every((v,j)=>v===pz.target[j])){const n=pz.moves;stopAll();
    if(!S.puzzleDone){S.puzzleDone=true;addScore(30)}award('puzzle');
    modal({title:t('win'),text:t('winPuz',{n}),buttons:[{t:t('again'),cls:'green',fn:startPuzzle},{t:t('menu'),fn:()=>showScreen('screen-start')}]})}
}
$('p-new').onclick=startPuzzle;

/* ---------- Müzik ---------- */
const NOTES=[['C',261.63,'#f87171'],['D',293.66,'#fb923c'],['E',329.63,'#facc15'],['F',349.23,'#4ade80'],['G',392,'#2dd4bf'],['A',440,'#60a5fa'],['B',493.88,'#818cf8'],['C',523.25,'#c084fc']];
const SOL=['Do','Re','Mi','Fa','Sol','La','Si','Do'];
const CLEF='M62 24C72 12 82 26 72 44C66 56 60 66 58 78C56 90 55 104 55 114C55 126 44 130 42 121C41 115 48 112 51 117M72 44C66 62 44 74 44 92C44 106 56 112 66 106C76 100 74 84 62 82C52 80 46 90 52 96C56 100 62 98 62 94';
const NSTEP=[0,1,2,3,4,5,6,7];
function showNote(i){const y=98-(NSTEP[i]-2)*6,col=NOTES[i][2],nt=$('nt'),h=$('head'),st=$('stem'),lg=$('ledger');
  nt.style.display='';h.setAttribute('cx',170);h.setAttribute('cy',y);h.setAttribute('fill',col);h.setAttribute('stroke','#222');h.setAttribute('stroke-width','1.5');h.setAttribute('transform','rotate(-18 170 '+y+')');
  if(NSTEP[i]<6){st.setAttribute('x1',179.5);st.setAttribute('x2',179.5);st.setAttribute('y1',y-1);st.setAttribute('y2',y-36)}else{st.setAttribute('x1',160.5);st.setAttribute('x2',160.5);st.setAttribute('y1',y+1);st.setAttribute('y2',y+36)}
  lg.style.display=NSTEP[i]===0?'':'none';if(NSTEP[i]===0){lg.setAttribute('y1',110);lg.setAttribute('y2',110)}
  const nm=$('nname');nm.style.color=col;nm.textContent=SOL[i]+' ('+NOTES[i][0]+')'}
function playNote(i){const f=NOTES[i][1];
  if(S.settings.sound){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});if(ac.state!=='running')ac.resume();
    const t0=ac.currentTime,o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.26,t0+.004);g.gain.exponentialRampToValueAtTime(.001,t0+.7);
    o.connect(g);o2.connect(g);g.connect(ac.destination);o.start(t0);o2.start(t0);o.stop(t0+.72);o2.stop(t0+.72)}catch(e){}}
  showNote(i);const k=$('piano').children[i];if(k){k.classList.add('on');setTimeout(()=>k.classList.remove('on'),120)}}
function initPiano(){const c=$('piano');c.innerHTML='';$('clef').setAttribute('d',CLEF);$('nt').style.display='none';$('nname').innerHTML='&nbsp;';
  $('mhint').textContent=Lg()==='tr'?'Kalın sesler uzun, ince sesler kısa tuşlarda. Dokun ve çal!':'Low notes are long keys, high notes are short keys. Touch and play!';
  $('m-tour').textContent='🎼 '+(Lg()==='tr'?'Gam Turu':'Scale Tour')+' ↑↓';
  NOTES.forEach(([n,f,col],i)=>{const k=document.createElement('button');k.className='xk';k.style.background=col;k.style.height=(220-i*17)+'px';k.innerHTML=SOL[i]+'<small>'+n+'</small>';
    k.addEventListener('pointerdown',e=>{e.preventDefault();playNote(i);markSeen('piano',String(i),8,'music')});
    k.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();playNote(i);markSeen('piano',String(i),8,'music')}});c.appendChild(k)})}
const MEL={twinkle:[261.63,261.63,392,392,440,440,392,349.23,349.23,329.63,329.63,293.66,293.66,261.63],
happy:[261.63,261.63,293.66,261.63,349.23,329.63,261.63,261.63,293.66,261.63,392,349.23],
jingle:[329.63,329.63,329.63,329.63,329.63,329.63,329.63,392,261.63,293.66,329.63]};
const nIdx=f=>NOTES.findIndex(x=>Math.abs(x[1]-f)<1);
function playMelody(n){gen++;MEL[n].forEach((f,i)=>after(i*350,()=>playNote(nIdx(f))))}
function scaleTour(){gen++;const seq=[0,1,2,3,4,5,6,7,6,5,4,3,2,1,0];seq.forEach((n,i)=>after(i*300,()=>playNote(n)))}

/* ---------- Ebeveyn paneli ---------- */
function renderParent(){const words=Object.values(S.seen).reduce((a,x)=>a+x.length,0);
  $('parent-box').innerHTML=[[t('sScore'),'⭐ '+S.score],[t('sGames'),'🎮 '+S.games],[t('sCoins'),'🚂'+(S.coins||0)],[t('sBadges'),'🏅 '+S.badges.length+' / '+BADGES.length],[t('sWords'),'📚 '+words]]

/* ---------- Ayarlar ---------- */
$('set-test').onclick=()=>{
  const ok='speechSynthesis' in window,tr=Lg()==='tr';TTS.err='';tone(660,.15);TTS.rec='…';after(200,()=>{sayBoth('Merhaba','Hello');try{const a=new Audio(window.VOICE['tr-TR|Merhaba']);a.volume=0;const pr=a.play();(pr&&pr.then?pr:Promise.resolve()).then(()=>{TTS.rec='ok';a.pause()},e=>{TTS.rec=(e&&e.name)||'hata'})}catch(e){TTS.rec='yok'}});
  after(2200,()=>{ttsVoices();const hv=l=>ttsPick(l)?(tr?'var':'yes'):(tr?'YOK':'NO');
    const lines=tr?['Ses: '+(S.settings.sound?'açık':'KAPALI'),'Kayıtlı ses: '+(TTS.rec==='ok'?'çalışıyor':TTS.rec),'Konuşma desteği: '+(ok?'var':'YOK'),'Bulunan ses sayısı: '+TTS.voices.length,'Türkçe ses: '+hv('tr-TR'),'İngilizce ses: '+hv('en-US'),'Hata: '+(TTS.err||'yok'),'','Ses gelmediyse: telefon ses seviyesini ve sessiz modunu kontrol et, sayfayı doğrudan Chrome veya Safari ile aç.']
      :['Sound: '+(S.settings.sound?'on':'OFF'),'Recorded audio: '+(TTS.rec==='ok'?'works':TTS.rec),'Speech support: '+(ok?'yes':'NO'),'Voices found: '+TTS.voices.length,'Turkish voice: '+hv('tr-TR'),'English voice: '+hv('en-US'),'Error: '+(TTS.err||'none'),'','If you heard nothing: check the phone volume and silent mode, and open the page directly in Chrome or Safari.'];
    modal({title:'🔊',text:lines.join('\n'),buttons:[{t:t('ok'),cls:'green'}]});$('m-text').style.whiteSpace='pre-line'})};
$('set-sound').onclick=()=>{S.settings.sound=!S.settings.sound;save();applyLang();if(!S.settings.sound)try{speechSynthesis.cancel()}catch(e){}};
const toggleDark=()=>{S.settings.dark=!S.settings.dark;save();applyDark();applyLang()};
$('set-dark').onclick=toggleDark;$('dark-btn').onclick=toggleDark;
$('set-reset').onclick=()=>gate(()=>modal({title:'🗑',text:t('resetAsk'),buttons:[{t:t('cancel')},{t:t('ok'),cls:'red',fn:()=>{const s=S.settings;S={...DEF,badges:[],countries:[],seen:{},owned:[],settings:{...s}};save();applyLang();showScreen('screen-start');toast(t('resetDone'))}}]}));
$('lang-tr').onclick=()=>{S.settings.lang='tr';save();applyLang()};
$('lang-en').onclick=()=>{S.settings.lang='en';save();applyLang()};

/* ---------- Başlangıç ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
applyDark();applyLang();save();
