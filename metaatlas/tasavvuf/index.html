<!DOCTYPE html>
<html lang="tr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasavvuf Âlemi · Meta Atlas</title>
<style>
:root{--bg:#04060f;--fg:#eaf2ff;--mut:#9db0d6;--line:rgba(180,200,240,.22);--card:rgba(14,22,48,.72);--g:#39ff88;--gold:#f5c76a}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(ellipse 80% 50% at 50% 28%,rgba(57,255,136,.14),transparent 62%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(70,100,255,.16),transparent 70%),#04060f;-webkit-text-size-adjust:100%}
.w{max-width:620px;margin:0 auto;padding:18px 18px 56px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.top a,.top button{color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
.sp{flex:1}
.tr,.en{display:none}html[lang="tr"] .tr,html[lang="en"] .en{display:inline}
.k{font:700 11px system-ui;letter-spacing:.2em;color:var(--g);text-transform:uppercase}
h1{font-size:clamp(30px,8vw,44px);line-height:1.1;margin:6px 0 10px;letter-spacing:.02em}
p{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:14px;border:1px solid var(--g);background:rgba(57,255,136,.12);color:var(--fg);font:700 15px system-ui;text-decoration:none;cursor:pointer}
.btn[aria-disabled="true"]{opacity:.45;border-color:var(--line);background:transparent;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style id="av-petek-std">
/* ============================================================
   STANDART PETEK BACKGROUND  ·  Version 1.0  ·  av-petek-std
   Atlasverse Ecosystem: Shared Visual Standard
   Biyolojik referans: işçi arı peteği gözü, yaklaşık 5,4 mm.
   (5,4 mm tasarım referansıdır; CSS boyutları ekrana uyar,
   her cihazda fiziksel 5,4 mm'ye kalibre değildir.)
   Geometri tüm plâtformlarda aynıdır. Markalar yalnızca RENK
   değiştirir: html[data-brand="x"] { --petek-bg; --petek-color; --petek-opacity }
   Tema: light|day  ve  dark|night. İsteğe bağlı mod: data-mode="lady|boy".
   ============================================================ */
:root {
  --petek-reference-mm: 5.4;
  --petek-size: clamp(26px, 2.5vw, 36px);
  --petek-height: calc(var(--petek-size) * 97 / 56);
  --petek-bg: #f6faf1; --petek-color: #b5d99c; --petek-opacity: 0.60;
}
html[data-theme="light"], html[data-theme="day"] { --petek-bg: #f6faf1; --petek-color: #b5d99c; --petek-opacity: 0.60; }
html[data-theme="dark"], html[data-theme="night"] { --petek-bg: #0b1426; --petek-color: #2a4a8a; --petek-opacity: 0.60; }
html[data-mode="lady"] { --petek-bg: #fff6fa; --petek-color: #f5aecb; --petek-opacity: 0.75; }
html[data-mode="lady"][data-theme="dark"], html[data-mode="lady"][data-theme="night"] { --petek-bg: #1d0f1c; --petek-color: #5c2b57; }
html[data-mode="boy"] { --petek-bg: #eefaff; --petek-color: #9fd8ee; --petek-opacity: 0.75; }
html[data-mode="boy"][data-theme="dark"], html[data-mode="boy"][data-theme="night"] { --petek-bg: #07101f; --petek-color: #17407e; }
html, body { min-height: 100%; }
html { background-color: var(--petek-bg) !important; }
body { position: relative; isolation: isolate; background: var(--petek-bg) !important; }
/* Kanonik petek maskesi: geometriyi değiştirme */
body::before, :root[data-theme="night"] body::before, :root[data-theme="day"] body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: var(--petek-color) !important; opacity: var(--petek-opacity) !important;
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><path d='M28 16.17L56 32.33V64.67L28 80.83L0 64.67V32.33Z M28 0V16.17 M28 80.83V97' fill='none' stroke='black' stroke-width='2.6'/></svg>");
  mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><path d='M28 16.17L56 32.33V64.67L28 80.83L0 64.67V32.33Z M28 0V16.17 M28 80.83V97' fill='none' stroke='black' stroke-width='2.6'/></svg>");
  -webkit-mask-repeat: repeat; mask-repeat: repeat;
  -webkit-mask-size: var(--petek-size) var(--petek-height); mask-size: var(--petek-size) var(--petek-height);
}
@media (max-width: 360px) { :root { --petek-size: 26px; } }
@media (min-width: 361px) and (max-width: 600px) { :root { --petek-size: 28px; } }
@media (min-width: 601px) and (max-width: 1024px) { :root { --petek-size: 32px; } }
@media (min-width: 1025px) { :root { --petek-size: 36px; } }
/* END · STANDART PETEK BACKGROUND V1.0 */
</style>
</head><body><div class="w"><div class="top"><a href="../araf/" data-route="metaatlas/araf/">← Araf</a><span class="sp"></span><button id="lg" type="button">TR / EN</button></div>

<script>
(function(){var l='tr';try{var s=localStorage.getItem('av_lang');if(s==='tr'||s==='en')l=s;}catch(e){}
document.documentElement.lang=l;
var b=document.getElementById('lg');if(b){b.addEventListener('click',function(){l=l==='tr'?'en':'tr';try{localStorage.setItem('av_lang',l);}catch(e){}document.documentElement.lang=l;});}})();
</script></body></html>
